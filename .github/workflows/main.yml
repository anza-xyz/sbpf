name: sbpf

on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  pull_request:
    branches:
      - main

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update --no-self-update
      - run: find . -name Cargo.toml | xargs -I'Cargo.toml' cargo fmt --all --manifest-path Cargo.toml -- --check

  clippy:
    name: Clippy
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        partition: [1, 2, 3]
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTFLAGS: "-Dwarnings -Cinstrument-coverage"
    steps:
      - uses: actions/checkout@v4
      - run: rustup update --no-self-update
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad
        with:
          tool: cargo-hack
      - run: find . -name Cargo.toml | xargs -I'Cargo.toml' cargo hack --partition ${{ matrix.partition }}/3 --each-feature clippy --manifest-path Cargo.toml --tests
        # NOTE: command below modifies `Cargo.toml` files, so run last.
      - run: find . -name Cargo.toml | xargs -I'Cargo.toml' cargo hack --remove-dev-deps --partition ${{ matrix.partition }}/3 --feature-powerset clippy --manifest-path Cargo.toml --all

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        rust: [stable, beta, nightly]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      RUSTFLAGS: "-Dwarnings -Cinstrument-coverage"
      LLVM_PROFILE_FILE: "sbpf-%p-%m.profraw"
      NEXTEST_FAILURE_OUTPUT: immediate-final
    steps:
      - uses: actions/checkout@v4
      - run: rustup update ${{ matrix.rust }} --no-self-update
      - run: rustup default ${{ matrix.rust }}
      - run: rustup component add clippy rustfmt llvm-tools
      # To update a tool version bump the hash here as needed.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad
        with:
          tool: nextest,grcov,cargo-hack

      - run: cargo nextest run --no-fail-fast
      - run: cargo nextest run --features="tracer,debugger" --no-fail-fast
      - run: cargo bench -- --quick --noplot --discard-baseline --nocapture
      - run: |
          grcov $(find . -name "sbpf-*.profraw" -print) \
            --branch \
            --ignore-not-existing \
            --source-dir $PWD/src \
            --binary-path ./target/debug \
            --output-types lcov \
            -o lcov.info

      - run: find . -name Cargo.toml -not -path './fuzz/*' | xargs -I'Cargo.toml' cargo hack --remove-dev-deps --each-feature build --manifest-path Cargo.toml
      - run: cargo install cargo-fuzz
      - run: cargo fuzz build
        if: matrix.rust == 'nightly' && matrix.os != 'windows-latest'

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.rust }}
          path: lcov.info
          if-no-files-found: error

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
    - uses: actions/checkout@v1
    - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad
      with:
        tool: grcov
    - name: Download test coverage
      uses: actions/download-artifact@v4
      with:
        pattern: coverage-*
        path: coverage
    - run: |
        grcov coverage \
          --source-dir $PWD/src \
          --output-types lcov \
          --output-path coverage.info
    - uses: codecov/codecov-action@v5
      with:
        files: coverage.info
        disable_search: true
        use_oidc: true
        fail_ci_if_error: true

  pr-status:
    name: PR CI Status
    needs:
      - fmt
      - clippy
      - test
      - coverage
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          status=0
          while read -r job result; do
            echo "$job $result"
            if [[ "$result" == failure || "$result" == cancelled ]]; then
              status=1
            fi
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$JOB_RESULTS")
          exit "$status"

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    environment: prod
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      contents: write
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      with:
        persist-credentials: false
    - run: cargo doc
    - run: cargo package
    - name: Generate SLSA provenance
      uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26  # v4.1.0
      env:
        NODE_OPTIONS: "--max-http-header-size=32768"
      with:
        subject-path: target/package/*.crate
    - uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe  # v1.0.4
      id: auth
    - name: Publish
      run: cargo publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

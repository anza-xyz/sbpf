name: sbpf

on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        rust: [stable, beta, nightly]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      RUSTFLAGS: "-Dwarnings -Cinstrument-coverage"
      LLVM_PROFILE_FILE: "sbpf-%p-%m.profraw"
      NEXTEST_FAILURE_OUTPUT: immediate-final
    steps:
      - uses: actions/checkout@v4
      - run: rustup update ${{ matrix.rust }} --no-self-update
      - run: rustup default ${{ matrix.rust }}
      - run: rustup component add clippy rustfmt llvm-tools
      # To update a tool version bump the hash here as needed.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad
        with:
          tool: nextest,grcov

      - run: cargo fmt --all -- --check
        if: matrix.rust == 'beta'
      - run: cargo clippy --all --tests -- --deny=warnings
        if: matrix.rust == 'beta'
      - run: cargo fmt --all --manifest-path cli/Cargo.toml -- --check
        if: matrix.rust == 'beta'
      - run: cargo clippy --all --tests --manifest-path cli/Cargo.toml -- --deny=warnings
        if: matrix.rust == 'beta'

      - run: cargo build --verbose
        # FIXME: this is not doing much of anything... maybe check? or run the test suite with this
        # enabled?
      - run: cargo build --features="shuttle-test"
      - run: cargo nextest run --no-fail-fast
      - run: cargo nextest run --features="tracer,debugger,codegen_debug" --no-fail-fast
      - run: cargo build --manifest-path cli/Cargo.toml --verbose
        # FIXME: this is not doing much of anything… maybe run a small subset of fuzzers' tests?
        # not using bininstall for cargo-fuzz as it seems to grab one for a random target...
      - run: cargo install cargo-fuzz
      - run: cargo fuzz build
        if: matrix.rust == 'nightly' && matrix.os != 'windows-latest'

      - run: cargo bench -- --quick --nocapture
      - shell: bash
        run: |
          grcov $(find . -name "sbpf-*.profraw" -print) \
            --branch \
            --ignore-not-existing \
            --source-dir $PWD/src \
            --binary-path ./target/debug \
            --output-types lcov \
            -o lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.rust }}
          path: lcov.info
          if-no-files-found: error

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
    - uses: actions/checkout@v1
    - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad
      with:
        tool: grcov
    - name: Download test coverage
      uses: actions/download-artifact@v4
      with:
        pattern: coverage-*
        path: coverage
    - shell: bash
      run: |
        grcov coverage \
          --source-dir $PWD/src \
          --output-types lcov \
          --output-path coverage.info
    - uses: codecov/codecov-action@v5
      with:
        files: coverage.info
        disable_search: true
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    environment: prod
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      contents: write
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      with:
        persist-credentials: false
    - name: Doc and package
      run: |
        cargo doc
        cargo package
      shell: bash
    - name: Generate SLSA provenance
      uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26  # v4.1.0
      env:
        NODE_OPTIONS: "--max-http-header-size=32768"
      with:
        subject-path: target/package/*.crate
    - uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe  # v1.0.4
      id: auth
    - name: Publish
      run: cargo publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
